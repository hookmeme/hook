<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/hookmeme/hook/refs/heads/main/images/hook.png">
<link rel="apple-touch-icon" href="https://raw.githubusercontent.com/hookmeme/hook/refs/heads/main/images/hook.png">

<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0c0d12;--card:#ffffff08;--border:#ffffff0d;--cyan:#7bdcff;--green:#3fb950;--red:#f85149;--purple:#a855f7;--text:#fff;--text2:#ffffff80;--text3:#ffffff4d}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.container{max-width:1440px;margin:0 auto;padding:20px}
button{cursor:pointer;border:none;font-family:inherit}
input{font-family:inherit}

.header{display:flex;align-items:center;justify-content:space-between;padding:16px 0;border-bottom:1px solid var(--border);margin-bottom:24px}
.header-left{display:flex;align-items:center;gap:16px}
.logo{width:48px;height:48px;border-radius:12px;object-fit:contain}
.token-name{font-size:24px;font-weight:700}
.token-badge{font-size:11px;padding:3px 8px;border-radius:6px;background:#7bdcff22;color:var(--cyan);border:1px solid #7bdcff44;font-weight:700}
.price-display{font-size:20px;font-weight:700;font-family:'Courier New',monospace;margin-top:4px}

.connect-btn{padding:10px 20px;border-radius:12px;background:linear-gradient(135deg,#7bdcff,#2563eb);color:#000;font-weight:700;font-size:14px;transition:all .2s}
.connect-btn:hover{opacity:.9;transform:translateY(-1px)}
.connect-btn.connected{background:#ffffff0f;color:var(--cyan);border:1px solid #7bdcff44}
.wallet-info{display:flex;align-items:center;gap:8px}
.wallet-dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

.main-grid{display:grid;grid-template-columns:7fr 5fr;gap:24px}
#col-info{display:none!important}
@media(max-width:768px){
  .header{flex-direction:column;align-items:flex-start;gap:12px}
  .header-right{width:100%;justify-content:flex-end}
  .header-left{gap:10px}
  .logo{width:36px;height:36px}
  .token-name{font-size:18px}
  .price-display{font-size:16px}
  .container{padding:12px}
  #bonding-curve-canvas{height:280px}
  .card{padding:16px;border-radius:16px}
  .card+.card,.card+div,.left-col .card:not(:first-child){margin-top:16px}
  .trade-tabs{flex-wrap:nowrap}
  .trade-tab{padding:8px 4px;font-size:12px}
  .input-field{padding:12px 14px;font-size:16px}
  .action-btn{padding:12px;font-size:13px}
  .pct-btns{gap:4px}
  .pct-btn{padding:6px;font-size:10px}
  .curve-legend{gap:8px}
  .curve-legend span{font-size:10px}
  .chart-header{flex-direction:column;align-items:flex-start;gap:6px}
  .slippage-btns{gap:3px}
  .slippage-btn{padding:4px 8px;font-size:10px}
  .mobile-tabs{margin-bottom:12px}
  .mobile-tab{padding:8px;font-size:11px}
}
@media(max-width:1024px){
  .main-grid{grid-template-columns:1fr;display:block}
  .left-col,.right-col{display:none!important}
  #col-info{display:none!important}
  #col-info.mobile-active{display:block!important}
  .left-col.mobile-active,.right-col.mobile-active{display:block!important}
  .desktop-only-card{display:none!important}
}

.card{border-radius:20px;border:1px solid var(--border);background:var(--card);padding:20px;backdrop-filter:blur(10px)}
.card-title{font-size:14px;color:var(--text2);font-weight:500;margin-bottom:16px}

.chart-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px}
#bonding-curve-canvas{width:100%;height:420px;border-radius:12px;display:block}

.trade-tabs{display:flex;gap:4px;padding:4px;background:#ffffff0a;border-radius:12px;margin-bottom:16px}
.trade-tab{flex:1;padding:10px;border-radius:8px;font-size:13px;font-weight:600;color:var(--text3);background:transparent;transition:all .2s}
.trade-tab.active-buy{background:var(--green);color:#000}
.trade-tab.active-sell{background:var(--red);color:#fff}
.trade-tab.active-borrow{background:var(--cyan);color:#000}
.trade-tab.active-repay{background:var(--purple);color:#fff}

.input-group{margin-bottom:12px}
.input-label{display:flex;justify-content:space-between;font-size:12px;color:var(--text3);margin-bottom:6px}
.input-field{width:100%;padding:14px 16px;border-radius:12px;background:#ffffff0a;border:1px solid var(--border);color:var(--text);font-size:18px;font-family:'Courier New',monospace;outline:none;transition:border-color .2s}
.input-field:focus{border-color:#7bdcff66}
.input-field::placeholder{color:#ffffff30}
.pct-btns{display:flex;gap:6px;margin-top:8px}
.pct-btn{flex:1;padding:8px;border-radius:10px;font-size:11px;font-weight:600;background:#ffffff0a;border:1px solid var(--border);color:var(--text3);transition:all .2s}
.pct-btn:hover{color:var(--text);border-color:#ffffff30}
.pct-btn.max{background:#7bdcff15;border-color:#7bdcff33;color:var(--cyan)}

.estimate-box{background:#ffffff0a;border-radius:12px;padding:12px;border:1px solid var(--border);margin:12px 0}
.estimate-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:3px 0}
.estimate-label{color:var(--text3)}
.estimate-value{font-family:'Courier New',monospace;font-weight:600}

.action-btn{width:100%;padding:14px;border-radius:16px;font-size:14px;font-weight:700;transition:all .2s;margin-top:12px}
.action-btn:disabled{opacity:.5;cursor:not-allowed}
.action-btn.buy{background:var(--green);color:#000}
.action-btn.sell{background:var(--red);color:#fff}
.action-btn.borrow{background:var(--cyan);color:#000}
.action-btn.repay{background:var(--purple);color:#fff}

.slippage-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.slippage-label{font-size:12px;color:var(--text3)}
.slippage-btns{display:flex;gap:4px}
.slippage-btn{padding:4px 10px;border-radius:8px;font-size:11px;font-weight:600;background:#ffffff0a;border:1px solid var(--border);color:var(--text3);transition:all .2s}
.slippage-btn.active{background:var(--cyan);color:#000;border-color:var(--cyan)}

.info-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #ffffff06}
.info-label{font-size:12px;color:var(--text3)}
.info-value{font-size:13px;font-family:'Courier New',monospace;font-weight:500}
.info-value.highlight{color:var(--cyan)}

.borrow-info{background:#7bdcff08;border-radius:12px;padding:12px;border:1px solid #7bdcff33;margin-bottom:12px}
.borrow-info .dot{width:8px;height:8px;border-radius:50%;background:var(--cyan);display:inline-block;margin-right:6px}
.borrow-info-title{font-size:12px;font-weight:600;color:#7bdcffcc;margin-bottom:8px}

.toast-container{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 20px;border-radius:12px;font-size:13px;font-weight:500;animation:slideIn .3s;backdrop-filter:blur(10px)}
.toast.success{background:#3fb95020;border:1px solid #3fb95044;color:var(--green)}
.toast.error{background:#f8514920;border:1px solid #f8514944;color:var(--red)}
.toast.loading{background:#7bdcff20;border:1px solid #7bdcff44;color:var(--cyan)}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

.contract-link{font-size:12px;font-family:'Courier New',monospace;color:var(--text2);text-decoration:none;transition:color .2s}
.contract-link:hover{color:var(--cyan)}

.mobile-tabs{display:none;gap:4px;padding:4px;background:#ffffff0a;border-radius:12px;margin-bottom:16px}
@media(max-width:1024px){
  .mobile-tabs{display:flex}
  .mobile-active{display:block!important}
}
.mobile-tab{flex:1;padding:10px;border-radius:8px;font-size:12px;font-weight:600;color:var(--text3);background:transparent;text-align:center;transition:all .2s}
.mobile-tab.active{background:#ffffff15;color:var(--text)}

.floor-box{background:linear-gradient(135deg,#7bdcff15,#7bdcff05);border-radius:12px;padding:12px;border:1px solid #7bdcff33;margin-bottom:12px}
.floor-box .floor-label{font-size:12px;color:#7bdcffaa}
.floor-box .floor-value{font-size:20px;font-weight:700;color:var(--cyan);font-family:'Courier New',monospace}

.social-links{display:flex;gap:12px;margin-top:12px}
.social-link{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);text-decoration:none;transition:color .2s}
.social-link:hover{color:var(--cyan)}

.curve-legend{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.curve-legend span{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text3)}
.curve-legend .leg-line{width:16px;height:3px;border-radius:2px;display:inline-block}
.lang-btn{padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600;background:#ffffff0a;border:1px solid var(--border);color:var(--text2);transition:all .2s;margin-right:8px}
.lang-btn:hover{color:var(--text);border-color:#ffffff30}
.lang-btn.active{background:var(--cyan);color:#000;border-color:var(--cyan)}
.header-right{display:flex;align-items:center;gap:8px}
</style>
</head>
<body>
<div id="app">
<div class="toast-container" id="toasts"></div>
<div class="container">
  <div class="header">
    <div class="header-left">
      <img class="logo" src="https://raw.githubusercontent.com/hookmeme/hook/refs/heads/main/images/hook.png" alt="HOOK">
      <div>
        <div style="display:flex;align-items:center;gap:10px">
          <span class="token-name">HOOK</span>
          <span class="token-badge">V4 Hook</span>

        <div style="display:flex;align-items:center;margin-top:4px">
          <span class="price-display" id="current-price">-- ETH</span>
        </div>
      </div>
    </div>
    <div class="header-right">
      <button class="lang-btn active" id="lang-en" onclick="setLang('en')">EN</button>
      <button class="lang-btn" id="lang-zh" onclick="setLang('zh')">CN</button>
      <button class="connect-btn" id="connect-btn" onclick="connectWallet()">Connect Wallet</button>
    </div>
  </div>

  <div class="mobile-tabs">
    <button class="mobile-tab active" onclick="switchMobileTab('chart',this)">Curve</button>
    <button class="mobile-tab" onclick="switchMobileTab('trade',this)">Trade</button>
    <button class="mobile-tab" onclick="switchMobileTab('info',this)">Info</button>
  </div>

  <div class="main-grid">
    <div class="left-col mobile-active" id="col-chart" style="display:block">
      <div class="card" style="margin-bottom:24px">
        <div class="chart-header">
          <span class="card-title" style="margin:0">Bonding Curve Price Curve</span>
          <div class="curve-legend">
            <span><i class="leg-line" style="background:#3fb950"></i>Supply</span>
            <span><i class="leg-line" style="background:#f59e0b"></i>Price</span>
            <span><i class="leg-line" style="background:#f8514966;border-bottom:2px dashed #f85149"></i>Current Position</span>
          </div>
        </div>
        <canvas id="bonding-curve-canvas"></canvas>
        <div id="curve-stats" style="display:flex;justify-content:center;gap:24px;margin-top:10px;flex-wrap:wrap"></div>
      </div>

      <div class="card desktop-only-card">
        <div class="card-title">On-Chain Data</div>
        <div id="stats-content"></div>
      </div>
    </div>

    <div class="right-col" id="col-trade" style="display:block">
      <div class="card" style="margin-bottom:24px">
        <div class="trade-tabs">
          <button class="trade-tab active-buy" id="tab-buy" onclick="switchTab('buy')">Buy</button>
          <button class="trade-tab" id="tab-sell" onclick="switchTab('sell')">Sell</button>
          <button class="trade-tab" id="tab-borrow" onclick="switchTab('borrow')">Borrow</button>
          <button class="trade-tab" id="tab-repay" onclick="switchTab('repay')">Repay</button>
        </div>
        <div id="trade-content"></div>
      </div>

      <div class="card desktop-only-card">
        <div class="card-title">Token Info</div>
        <div id="token-info-content"></div>
      </div>
    </div>

    <!-- Mobile Info Tab -->
    <div class="left-col" id="col-info">
      <div class="card" style="margin-bottom:24px">
        <div class="card-title">On-Chain Data</div>
        <div id="stats-content-mobile"></div>
      </div>
      <div class="card">
        <div class="card-title">Token Info</div>
        <div id="token-info-content-mobile"></div>
      </div>
    </div>
  </div>
</div>
</div>

function t(key) { return i18n[currentLang][key] || key; }

function setLang(lang) {
  currentLang = lang;
  document.getElementById('lang-en').className = 'lang-btn' + (lang === 'en' ? ' active' : '');
  document.getElementById('lang-zh').className = 'lang-btn' + (lang === 'zh' ? ' active' : '');
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  // Re-render all UI
  updateConnectBtn();
  renderMobileTabs();
  renderChartHeader();
  renderStats();
  renderTokenInfo();
  renderTradeContent();
  renderTradeTabLabels();
  drawBondingCurve();
}

function renderMobileTabs() {
  const tabs = document.querySelector('.mobile-tabs');
  if (tabs) {
    tabs.innerHTML = `
      <button class="mobile-tab active" onclick="switchMobileTab('chart',this)">${t('curve')}</button>

// ==================== BONDING CURVE MATH (mirrors contract) ====================
// curveP(s, k) = k * s / 1e18  (s in wei)
// In human units: price(supply_tokens) = K * supply_tokens (in wei per token)
// curveV(s, k) = k * s^2 / (2 * 1e18)  (cumulative ETH in wei)
// In human units: cumETH(supply_tokens) = K * supply_tokens^2 / 2 (in wei)

function curvePrice(supplyTokens) {
  // Returns price in ETH (float)
  // P = K * s where s is in 1e18 units, result in wei
  // P(tokens) = K * tokens * 1e18 / 1e18 = K * tokens (in wei)
  // In ETH: K * tokens / 1e18
  return (K * supplyTokens) / 1e18;
}

function curveCumulativeETH(supplyTokens) {
  // V = K * s^2 / (2 * 1e18) where s in wei
  // s = supplyTokens * 1e18
  // V = K * (supplyTokens * 1e18)^2 / (2 * 1e18) = K * supplyTokens^2 * 1e18 / 2
  // In ETH: K * supplyTokens^2 / 2 / 1e18 ...
  // Actually simpler: V in ETH = K * supplyTokens^2 / (2 * 1e18)
  // Wait let me be precise with the contract math.
  // s_wei = supplyTokens * 1e18
  // s2 = s_wei * s_wei / 1e18 = supplyTokens^2 * 1e18
  // V_wei = K * s2 / (2 * 1e18) = K * supplyTokens^2 * 1e18 / (2 * 1e18) = K * supplyTokens^2 / 2
  // V_eth = V_wei / 1e18 = K * supplyTokens^2 / (2 * 1e18)
  return (K * supplyTokens * supplyTokens) / (2 * 1e18);
}

// ==================== BONDING CURVE CHART ====================
function drawBondingCurve() {
  const canvas = document.getElementById('bonding-curve-canvas');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  const W = rect.width;
  const H = rect.height;

  // Clear
  ctx.fillStyle = '#0c0d12';
  ctx.fillRect(0, 0, W, H);

  // Chart area with margins
  const margin = { top: 30, right: 70, bottom: 50, left: 70 };
  const cw = W - margin.left - margin.right;
  const ch = H - margin.top - margin.bottom;

  // Current state from on-chain data
  const currentSupply = tokenData.totalSupply ? parseFloat(ethers.utils.formatEther(tokenData.totalSupply)) : 0;
  const currentFloor = tokenData.floorPrice ? parseFloat(ethers.utils.formatEther(tokenData.floorPrice)) : 0;
  const currentPrice = tokenData.effectivePrice ? parseFloat(ethers.utils.formatEther(tokenData.effectivePrice)) : 0;

  // DYNAMIC ZOOM: focus around current position
  // Show from 0 to ~2.5x current supply so current point is visible and clear
  const zoomSupplyMax = currentSupply > 0 ? currentSupply * 2.5 : MAX_SUPPLY * 0.1;
  // Cap at max supply
  const supplyRangeMax = Math.min(zoomSupplyMax, MAX_SUPPLY);

  // X-axis: cumulative ETH range based on zoomed supply
  const currentCumETH = curveCumulativeETH(currentSupply);
  const xMax = Math.max(curveCumulativeETH(supplyRangeMax), currentCumETH * 2.5, 1);

  // Y-left: supply range (zoomed)
  const yLeftMax = supplyRangeMax;

  // Y-right: price range (zoomed to ~2.5x current price)
  const priceAtRangeMax = curvePrice(supplyRangeMax);
  const yRightMax = Math.max(priceAtRangeMax, currentPrice * 2.5, currentFloor * 3, 0.0001);

  // Helper: map data to canvas coords
  function xToCanvas(cumEth) { return margin.left + (cumEth / xMax) * cw; }
  function supplyToCanvas(s) { return margin.top + ch - (s / yLeftMax) * ch; }
  function priceToCanvas(p) { return margin.top + ch - (p / yRightMax) * ch; }

  // Draw grid lines
  ctx.strokeStyle = '#ffffff0a';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 5; i++) {
    const y = margin.top + (ch / 5) * i;
    ctx.beginPath();
    ctx.moveTo(margin.left, y);
    ctx.lineTo(margin.left + cw, y);
    ctx.stroke();
  }
  for (let i = 0; i <= 5; i++) {
    const x = margin.left + (cw / 5) * i;
    ctx.beginPath();
    ctx.moveTo(x, margin.top);
    ctx.lineTo(x, margin.top + ch);
    ctx.stroke();
  }

  // Generate curve data points (only up to zoomed range)
  const numPoints = 300;
  const supplyPoints = [];
  const pricePoints = [];

  for (let i = 0; i <= numPoints; i++) {
    const s = (i / numPoints) * supplyRangeMax;
    const cumEth = curveCumulativeETH(s);
    const price = curvePrice(s);
    supplyPoints.push({ cumEth, supply: s, price });
    pricePoints.push({ cumEth, price });
  }

  // Draw supply curve (green) with area fill
  ctx.beginPath();
  ctx.moveTo(xToCanvas(0), supplyToCanvas(0));
  for (const pt of supplyPoints) {
    ctx.lineTo(xToCanvas(pt.cumEth), supplyToCanvas(pt.supply));
  }
  // Fill area under supply curve
  const lastSupplyPt = supplyPoints[supplyPoints.length - 1];
  ctx.lineTo(xToCanvas(lastSupplyPt.cumEth), supplyToCanvas(0));
  ctx.lineTo(xToCanvas(0), supplyToCanvas(0));
  ctx.closePath();
  const grad = ctx.createLinearGradient(0, margin.top, 0, margin.top + ch);
  grad.addColorStop(0, 'rgba(63,185,80,0.25)');
  grad.addColorStop(1, 'rgba(63,185,80,0.02)');
  ctx.fillStyle = grad;
  ctx.fill();

  // Stroke supply curve
  ctx.beginPath();
  ctx.moveTo(xToCanvas(0), supplyToCanvas(0));
  for (const pt of supplyPoints) {
    ctx.lineTo(xToCanvas(pt.cumEth), supplyToCanvas(pt.supply));
  }
  ctx.strokeStyle = '#3fb950';
  ctx.lineWidth = 2.5;
  ctx.stroke();

  // Draw price curve (orange/yellow)
  ctx.beginPath();
  let started = false;
  for (const pt of pricePoints) {
    const x = xToCanvas(pt.cumEth);
    const y = priceToCanvas(pt.price);
    if (!started) { ctx.moveTo(x, y); started = true; }
    else ctx.lineTo(x, y);
  }
  ctx.strokeStyle = '#f59e0b';
  ctx.lineWidth = 2.5;
  ctx.stroke();

  // Draw floor price line (dashed, if available)
  if (currentFloor > 0) {
    const floorY = priceToCanvas(currentFloor);
    ctx.setLineDash([6, 4]);
    ctx.beginPath();
    ctx.moveTo(margin.left, floorY);
    ctx.lineTo(margin.left + cw, floorY);
    ctx.strokeStyle = '#7bdcff66';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.setLineDash([]);
    // Label
    ctx.fillStyle = '#7bdcffaa';
    ctx.font = '10px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(t('floorLabel') + ' ' + smartFormat(currentFloor) + ' ETH', margin.left + 5, floorY - 5);
  }

  // Draw current position marker
  if (currentSupply > 0) {
    const curCumEth = curveCumulativeETH(currentSupply);
    const cx = xToCanvas(curCumEth);

    // Vertical dashed line at current position
    ctx.setLineDash([4, 3]);
    ctx.beginPath();
    ctx.moveTo(cx, margin.top);
    ctx.lineTo(cx, margin.top + ch);
    ctx.strokeStyle = '#f8514966';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.setLineDash([]);

    // Circle on supply curve
    const sy = supplyToCanvas(currentSupply);
    ctx.beginPath();
    ctx.arc(cx, sy, 6, 0, Math.PI * 2);
    ctx.fillStyle = '#0c0d12';
    ctx.fill();
    ctx.strokeStyle = '#3fb950';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Circle on price curve
    const py = priceToCanvas(currentPrice);
    ctx.beginPath();
    ctx.arc(cx, py, 6, 0, Math.PI * 2);
    ctx.fillStyle = '#0c0d12';
    ctx.fill();
    ctx.strokeStyle = '#f59e0b';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // Axes labels
  ctx.fillStyle = '#ffffff60';
  ctx.font = '11px -apple-system, sans-serif';

  // X-axis labels
  ctx.textAlign = 'center';
  for (let i = 0; i <= 5; i++) {
    const val = (xMax / 5) * i;
    const x = xToCanvas(val);
    let label;
    if (val >= 1000) label = (val/1000).toFixed(1) + 'K';
    else if (val >= 1) label = val.toFixed(1);
    else label = smartFormat(val);
    ctx.fillText(label, x, margin.top + ch + 20);
  }
  ctx.fillText(t('cumEth'), margin.left + cw / 2, margin.top + ch + 40);

  // Y-left labels (supply)
  ctx.textAlign = 'right';
  for (let i = 0; i <= 4; i++) {
    const val = (yLeftMax / 4) * i;
    const y = supplyToCanvas(val);
    ctx.fillStyle = '#3fb95099';
    let label;
    if (val >= 1e6) label = (val/1e6).toFixed(2) + 'M';
    else if (val >= 1000) label = (val/1000).toFixed(1) + 'K';
    else label = val.toFixed(0);
    ctx.fillText(label, margin.left - 8, y + 4);
  }

  // Y-right labels (price)
  ctx.textAlign = 'left';
  for (let i = 0; i <= 4; i++) {
    const val = (yRightMax / 4) * i;
    const y = priceToCanvas(val);
    ctx.fillStyle = '#f59e0b99';
    ctx.fillText(smartFormat(val) + ' E', margin.left + cw + 8, y + 4);
  }

  // Top-right info box
  ctx.textAlign = 'right';
  ctx.font = '11px monospace';
  ctx.fillStyle = '#3fb950';
  ctx.fillText('max 21M', W - 10, 16);
  ctx.fillStyle = '#7bdcff';
  const mintedStr = currentSupply > 0 ? fmtSupplyShort(currentSupply) : '--';
  ctx.fillText('minted ' + mintedStr, W - 10, 30);
  ctx.fillStyle = '#f59e0b';
  const priceStr = currentPrice > 0 ? smartFormat(currentPrice) + ' ETH' : '--';
  ctx.fillText('price ' + priceStr, W - 10, 44);
  ctx.fillStyle = '#ffffff40';
  ctx.fillText(t('displayRange') + ' ' + fmtSupplyShort(supplyRangeMax), W - 10, 58);

  // Update curve stats below canvas
  const statsEl = document.getElementById('curve-stats');
  if (currentSupply > 0) {
    const cumEth = curveCumulativeETH(currentSupply);
    statsEl.innerHTML = `
      <span style="font-size:11px;color:var(--text3)">${t('minted')}: <b style="color:var(--green)">${fmtSupplyShort(currentSupply)}</b></span>
      <span style="font-size:11px;color:var(--text3)">${t('cumEth')}: <b style="color:var(--cyan)">${cumEth.toFixed(2)} ETH</b></span>
      <span style="font-size:11px;color:var(--text3)">${t('currentPrice')}: <b style="color:#f59e0b">${smartFormat(currentPrice)} ETH</b></span>
      <span style="font-size:11px;color:var(--text3)">${t('floorLabel')}: <b style="color:var(--cyan)">${smartFormat(currentFloor)} ETH</b></span>
    `;
  }
}

function fmtSupplyShort(v) {
  if (v >= 1e6) return (v / 1e6).toFixed(2) + 'M';
  if (v >= 1e3) return (v / 1e3).toFixed(1) + 'K';
  return v.toFixed(0);
}

// ==================== FORMATTING ====================
function smartFormat(price) {
  if (price === 0) return '0';
  if (price >= 1) return price.toFixed(4);
  const s = price.toFixed(18);
  const dot = s.indexOf('.');
  let firstNZ = -1;
  for (let i = dot + 1; i < s.length; i++) { if (s[i] !== '0') { firstNZ = i; break; } }
  if (firstNZ === -1) return '0';
  return price.toFixed(Math.min(firstNZ - dot + 2, 14));
}

function fmtEth(wei) {
  if (!wei || wei === '0') return '0';
  try { return smartFormat(parseFloat(ethers.utils.formatEther(wei))); } catch { return '0'; }
}

function fmtToken(wei) {
  if (!wei || wei === '0') return '0';
  try {
    const v = parseFloat(ethers.utils.formatEther(wei));
    if (v >= 1000000) return (v/1000000).toFixed(2) + 'M';
    if (v >= 1000) return (v/1000).toFixed(2) + 'K';
    return v.toFixed(2);
  } catch { return '0'; }
}

      <div class="estimate-box" id="estimate-box" style="display:none"></div>
      <button class="action-btn borrow" id="action-btn" onclick="executeBorrow()" ${!account?'disabled':''}>
        ${!account?t('connectWallet'):t('borrowEth')}
      </button>
      ${userBorrowedETH !== '0' && BigInt(userBorrowedETH) > 0n ? `<button class="action-btn borrow" style="margin-top:8px;background:#7bdcff33;color:var(--cyan)" onclick="executeBorrowMore()">${t('borrowMore')}</button>` : ''}
    `;
  } else if (currentTab === 'repay') {
    const hasDebt = userBorrowedETH !== '0' && BigInt(userBorrowedETH) > 0n;
    el.innerHTML = `
      <div class="borrow-info" style="border-color:#a855f744;background:#a855f708">
        <div class="borrow-info-title" style="color:#c084fc"><span class="dot" style="background:var(--purple)"></span>${t('repayInfo')}</div>
        <div class="estimate-row"><span class="estimate-label">${t('outstandingDebt')}</span><span class="estimate-value" style="color:var(--purple)">${fmtEth(userBorrowedETH)} ETH</span></div>
        <div class="estimate-row"><span class="estimate-label">${t('lockedTokens')}</span><span class="estimate-value" style="color:var(--purple)">${fmtToken(userCollateral)} HOOK</span></div>
      </div>
      ${hasDebt ? `
        <div class="input-group">
          <div class="input-label"><span>${t('repayAmount')}</span><span>${t('balance')}: ${fmtEth(userEthBalance)} ETH</span></div>
          <input class="input-field" type="number" id="trade-amount" placeholder="0.0" step="any">
          <div class="pct-btns">
            ${[25,50,75].map(p => `<button class="pct-btn" onclick="setPctDebt(${p})">${p}%</button>`).join('')}
            <button class="pct-btn max" onclick="setPctDebt(100)">MAX</button>
          </div>
        </div>
        <button class="action-btn repay" onclick="executeRepay()" ${!account?'disabled':''}>${!account?t('connectWallet'):t('repay')}</button>
      ` : `<div style="text-align:center;padding:32px;color:var(--green)">${t('noDebt')}</div>`}
    `;
  }
}

function setSlippage(s) { slippage = s; renderTradeContent(); }

function setPct(pct) {
  const raw = currentTab === 'buy' ? userEthBalance : userTokenBalance;
  let bn = ethers.BigNumber.from(raw || '0');
  if (pct === 100 && currentTab === 'buy') {
    bn = bn.sub(ethers.utils.parseEther('0.002'));
    if (bn.lt(0)) bn = ethers.BigNumber.from(0);
  } else { bn = bn.mul(pct).div(100); }
  const input = document.getElementById('trade-amount');
  if (input && bn.gt(0)) { input.value = ethers.utils.formatEther(bn); onAmountChange(); }
}

function setPctToken(pct) {
  let bn = ethers.BigNumber.from(userTokenBalance || '0').mul(pct).div(100);
  const input = document.getElementById('trade-amount');
  if (input && bn.gt(0)) input.value = ethers.utils.formatEther(bn);
}

function setPctDebt(pct) {
  let bn = ethers.BigNumber.from(userBorrowedETH || '0').mul(pct).div(100);
  const input = document.getElementById('trade-amount');
  if (input && bn.gt(0)) input.value = ethers.utils.formatEther(bn);
}

// ==================== ESTIMATES ====================
let estimateTimer = null;
function onAmountChange() {
  clearTimeout(estimateTimer);
  estimateTimer = setTimeout(async () => {
    const input = document.getElementById('trade-amount');
    const box = document.getElementById('estimate-box');
    if (!input || !box) return;
    const val = input.value;
    if (!val || parseFloat(val) <= 0) { box.style.display = 'none'; return; }
    try {
      const hookContract = new ethers.Contract(HOOK_ADDRESS, HOOK_ABI, provider);
      if (currentTab === 'buy') {
        const wei = ethers.utils.parseEther(val);
        const result = await hookContract.estimateBuy(wei);
        box.style.display = 'block';
        box.innerHTML = `
          <div class="estimate-row"><span class="estimate-label">${t('estReceive')}</span><span class="estimate-value" style="color:var(--green)">~${fmtToken(result.tokensOut.toString())} HOOK</span></div>
          <div class="estimate-row"><span class="estimate-label">${t('fee')}</span><span class="estimate-value">${fmtEth(result.swapFee.toString())} ETH</span></div>
        `;
      } else if (currentTab === 'sell') {
        const wei = ethers.utils.parseEther(val);
        const result = await hookContract.estimateSell(wei);
        box.style.display = 'block';
        box.innerHTML = `
          <div class="estimate-row"><span class="estimate-label">${t('estReceive')}</span><span class="estimate-value" style="color:var(--red)">~${fmtEth(result.ethOut.toString())} ETH</span></div>
          <div class="estimate-row"><span class="estimate-label">${t('fee')}</span><span class="estimate-value">${fmtEth(result.swapFee.toString())} ETH</span></div>
        `;
      }
    } catch(e) { box.style.display = 'none'; }
  }, 400);
}

function onBorrowAmountChange() {
  const input = document.getElementById('trade-amount');
  const box = document.getElementById('estimate-box');
  if (!input || !box) return;
  const val = input.value;
  if (!val || parseFloat(val) <= 0 || !tokenData.floorPrice || tokenData.floorPrice === '0') { box.style.display = 'none'; return; }
  try {
    const tokenWei = ethers.utils.parseEther(val);
    const fp = ethers.BigNumber.from(tokenData.floorPrice);
    const value = tokenWei.mul(fp).div(ethers.utils.parseEther('1'));
    const collateralValue = value.mul(9700).div(10000);
    const fee = collateralValue.mul(300).div(10000);
    const receive = collateralValue.sub(fee);
    box.style.display = 'block';
    box.innerHTML = `
      <div class="estimate-row"><span class="estimate-label">${t('estReceiveShort')}</span><span class="estimate-value" style="color:var(--cyan)">~${fmtEth(receive.toString())} ETH</span></div>
      <div class="estimate-row"><span class="estimate-label">${t('borrowFee3')}</span><span class="estimate-value">${fmtEth(fee.toString())} ETH</span></div>
    `;
  } catch { box.style.display = 'none'; }
}

// ==================== TRADE EXECUTION ====================
async function executeTrade() {
  if (!account || !signer) { showToast(t('connectWallet'), 'error'); return; }
  const input = document.getElementById('trade-amount');
  if (!input || !input.value || parseFloat(input.value) <= 0) return;
  const btn = document.getElementById('action-btn');
  btn.disabled = true;
  btn.textContent = '...';
  let toast;
  try {
    const router = new ethers.Contract(HOOK_SWAP_ROUTER_ADDRESS, HOOK_SWAP_ROUTER_ABI, signer);
    if (currentTab === 'buy') {
      const value = ethers.utils.parseEther(input.value);
      let minOut = ethers.BigNumber.from(0);
      try {
        const hookContract = new ethers.Contract(HOOK_ADDRESS, HOOK_ABI, provider);
        const est = await hookContract.estimateBuy(value);
        minOut = est.tokensOut.mul(100 - slippage).div(100);
      } catch {}
      toast = showToast(t('buying'), 'loading');
      const tx = await router.buy(POOL_KEY_TUPLE, minOut, { value });
      await tx.wait();
      toast.remove();
      showToast(t('buySuccess'), 'success');
    } else {
      const amount = ethers.utils.parseEther(input.value);
      const tokenContract = new ethers.Contract(HOOK_TOKEN_ADDRESS, HOOK_TOKEN_ABI, signer);
      const allowance = await tokenContract.allowance(account, HOOK_SWAP_ROUTER_ADDRESS);
      if (allowance.lt(amount)) {
        toast = showToast(t('approving'), 'loading');
        const appTx = await tokenContract.approve(HOOK_SWAP_ROUTER_ADDRESS, ethers.constants.MaxUint256);
        await appTx.wait();
        toast.remove();
      }
      let minOut = ethers.BigNumber.from(0);
      try {
        const hookContract = new ethers.Contract(HOOK_ADDRESS, HOOK_ABI, provider);
        const est = await hookContract.estimateSell(amount);
        minOut = est.ethOut.mul(100 - slippage).div(100);
      } catch {}
      toast = showToast(t('selling'), 'loading');
      const tx = await router.sell(POOL_KEY_TUPLE, amount, minOut);
      await tx.wait();
      toast.remove();
      showToast(t('sellSuccess'), 'success');
    }
    input.value = '';
    await refresh();
  } catch(e) {
    if (toast) toast.remove();
    showToast(e.reason || e.message || t('tradeFailed'), 'error');
  }
  btn.disabled = false;
  btn.textContent = currentTab === 'buy' ? t('buyHook') : t('sellHook');
}

async function executeBorrow() {
  if (!account || !signer) { showToast(t('connectWallet'), 'error'); return; }
  const input = document.getElementById('trade-amount');
  if (!input || !input.value || parseFloat(input.value) <= 0) return;
  const btn = document.getElementById('action-btn');
  btn.disabled = true;
  let toast;
  try {
    const amount = ethers.utils.parseEther(input.value);
    const tokenContract = new ethers.Contract(HOOK_TOKEN_ADDRESS, HOOK_TOKEN_ABI, signer);
    const allowance = await tokenContract.allowance(account, HOOK_ADDRESS);
    if (allowance.lt(amount)) {
      toast = showToast(t('approving'), 'loading');
      const appTx = await tokenContract.approve(HOOK_ADDRESS, ethers.constants.MaxUint256);
      await appTx.wait();
      toast.remove();
    }
    toast = showToast(t('borrowing'), 'loading');
    const hookContract = new ethers.Contract(HOOK_ADDRESS, HOOK_ABI, signer);
    const tx = await hookContract.borrow(amount);
    await tx.wait();
    toast.remove();
    showToast(t('borrowSuccess'), 'success');
    input.value = '';
    await refresh();
  } catch(e) {
    if (toast) toast.remove();
    showToast(e.reason || e.message || t('borrowFailed'), 'error');
  }
  btn.disabled = false;
}

async function executeBorrowMore() {
  if (!account || !signer) return;
  let toast = showToast(t('borrowingMore'), 'loading');
  try {
    const hookContract = new ethers.Contract(HOOK_ADDRESS, HOOK_ABI, signer);
    const tx = await hookContract.borrowMore();
    await tx.wait();
    toast.remove();
    showToast(t('borrowMoreSuccess'), 'success');
    await refresh();
  } catch(e) { toast.remove(); showToast(e.reason || e.message || t('failed'), 'error'); }
}

async function executeRepay() {
  if (!account || !signer) return;
  const input = document.getElementById('trade-amount');
  if (!input || !input.value || parseFloat(input.value) <= 0) return;
  let toast = showToast(t('repaying'), 'loading');
  try {
    const hookContract = new ethers.Contract(HOOK_ADDRESS, HOOK_ABI, signer);
    const value = ethers.utils.parseEther(input.value);
    const tx = await hookContract.repay({ value });
    await tx.wait();
    toast.remove();
    showToast(t('repaySuccess'), 'success');
    input.value = '';
    await refresh();
  } catch(e) { toast.remove(); showToast(e.reason || e.message || t('repayFailed'), 'error'); }
}

// ==================== REFRESH ====================
async function refresh() {
  await Promise.all([fetchOnChainData(), fetchBalances()]);
}

// ==================== MOBILE ====================
function switchMobileTab(tab, btn) {
  document.querySelectorAll('.mobile-tab').forEach(el => el.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('col-chart').classList.toggle('mobile-active', tab === 'chart');
  document.getElementById('col-trade').classList.toggle('mobile-active', tab === 'trade');
  document.getElementById('col-info').classList.toggle('mobile-active', tab === 'info');
}

// ==================== INIT ====================
async function init() {
  renderTradeContent();
  drawBondingCurve(); // Draw empty curve first
  await fetchOnChainData();
  setInterval(fetchOnChainData, 15000);
  setInterval(() => { if(account) fetchBalances(); }, 15000);
  window.addEventListener('resize', () => drawBondingCurve());
  if (window.ethereum) {
    window.ethereum.on('accountsChanged', (accounts) => {
      account = accounts[0] || null;
      if (account) {
        const web3Provider = new ethers.providers.Web3Provider(window.ethereum);
        signer = web3Provider.getSigner();
      } else { signer = null; }
      updateConnectBtn();
      fetchBalances();
      renderTradeContent();
    });
    window.ethereum.on('chainChanged', () => window.location.reload());
  }
}

init();
</script>
